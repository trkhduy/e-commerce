server:
  port: 8089

app:
  api-prefix: /api/v1

config:
  cors: http://localhost:3000,http://localhost:4567

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/identity/**
        - id: product-service
          uri: http://192.168.0.107:8888
          predicates:
            - Path=${app.api-prefix}/**
